[project]
name = "hums"
version = "0.2.0"
description = "Pervititch 1923 Block 147 — LOD3 BIM reconstruction pipeline"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pyshp>=2.3.1",
    "lxml>=5.3.0",
    "pyproj>=3.7.0",
    "shapely>=2.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hums*"]

[tool.ruff]
line-length = 110
target-version = "py314"
